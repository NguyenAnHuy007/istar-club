spring.application.name=istar
server.port=${PORT:8080}

# DATABASE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/istar_club}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
# ===============================
jwt.secret=${JWT_SECRET:vHGguDXWhUoYqgeK1G6cDUZZAKGinKsHQkb8iBiDnQtcsJ5xmuZCIAMZ/ii4rZQO28SBNKlyZojEedja4lC4zw==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# FILE UPLOAD
# ===============================
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# SQL INITIALIZATION & CONSTRAINTS
# ===============================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/constraints.sql
spring.sql.init.continue-on-error=true

# CORS CONFIGURATION
# ===============================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*}


